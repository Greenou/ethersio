name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows-binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Application
        run: dotnet build Ethersio.csproj -c Release -o dist/build
      - name: Installeur
        run: dotnet build setup/Setup.csproj -c Release -o dist/setup -p:Version="$(tr -d '[:space:]' < VERSION.txt)" -p:EthersioExe="$PWD/dist/build/Ethersio.exe"
      - uses: actions/upload-artifact@v7
        with:
          name: ethersio-windows
          path: |
            dist/build/Ethersio.exe
            dist/setup/Ethersio-Setup.exe
