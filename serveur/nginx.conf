# Ethersio - site de telechargement et de mises a jour (conteneur nginx sans privileges, lecture seule).
# Ecoute sur 127.0.0.1 : seul le tunnel Cloudflare (ethersio.barthaux.fr) y accede.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 128; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    sendfile on;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 127.0.0.1:8400;
        root /usr/share/nginx/html;
        index index.html;
        autoindex off;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;

        location / {
            try_files $uri $uri/ =404;
        }

        location = /health {
            default_type text/plain;
            return 200 "ok";
        }

        # les PC doivent toujours voir la derniere version
        location = /version.json {
            default_type application/json;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options nosniff always;
        }

        # page et installeur : toujours revalides (ils changent a chaque publication, Cloudflare les met en cache)
        location ~ (\.html|Ethersio-Setup\.exe)$ {
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options nosniff always;
        }

        # releases immuables : un numero de version = un fichier
        location ~ ^/Ethersio-[0-9.]+\.exe$ {
            default_type application/octet-stream;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options nosniff always;
        }
    }
}
